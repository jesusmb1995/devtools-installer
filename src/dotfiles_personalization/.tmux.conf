set-option -g default-shell /bin/zsh
set-window-option -g mode-keys vi
set -g status-format[0] '#{W:#I#F }'
set -g status-bg black
set -g status-fg colour244
bind c new-window -c "#{pane_current_path}"

# Unbind tmux's C-l (refresh-client) so the key reaches the pane. This is
# required for nvim's agent terminal <C-l> mappings (open/send/close) when
# nvim runs inside tmux and the agent term attaches to a warm `agent@<hash>`
# session: otherwise the inner tmux captures C-l before nvim sees it.
unbind C-l

# Copy to clipboard
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# --- Terminal rendering (nested tmux / nvim compatibility) -------------------
# Required when this warm-daemon tmux is nested inside the outer WM tmux
# (gerpsonal_term preset). Without these, escape sequences from nvim get
# mangled passing through the layers → broken terminal, dotted lines, broken
# nerdfont icons.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB,*:Tc"
set -g allow-passthrough on
set -g extended-keys on
set -sg escape-time 10
