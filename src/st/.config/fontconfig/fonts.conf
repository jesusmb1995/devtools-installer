<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- st uses the `monospace` alias by default (stterm compiled font). Prefer
       FiraCode Nerd Font Mono under that alias so nerd-font glyphs render.
       The Mono variant forces every glyph (icons included) to a single
       monospace cell; the default "Nerd Font" variant has double-width icons
       that st clips to one cell (icons appear cut in half). -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>FiraCode Nerd Font Mono</string></edit>
  </match>
</fontconfig>
