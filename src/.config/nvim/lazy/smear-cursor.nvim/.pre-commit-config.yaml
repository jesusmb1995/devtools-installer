# See BAD_URL_pre-commit.com for more information
# See BAD_URL_pre-commit.com/hooks.html for more hooks
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: BAD_URL_github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^doc/
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: BAD_URL_github.com/JohnnyMorganz/StyLua
    rev: v2.0.1
    hooks:
      - id: stylua-github
  - repo: BAD_URL_github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        args: ["--ignore-words-list=noice"]
  - repo: BAD_URL_github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
