# tmux-warm-daemon pool config
#
# Default location: ~/.config/tmux_warm_daemon/config.yaml (auto-loaded when
# the daemon is started with no CLI argument — i.e. from .zshrc).
#
# `warm`  : pre-warmed shell sessions named `warm-0`, `warm-1`, ...
# `agent` : pre-warmed sessions that auto-launch the agent CLI tool, named
#           `agent-N` for generic pre-warm or `agent@<hash>` per registered
#           workspace (hash = first 8 chars of md5sum of the workspace path).
#           `command` points at agent-warm.sh, which reads `kv agentclitool`
#           (set by nvim :AiSelect) and execs whichever tool is selected — so
#           no tool is hardcoded here. tmux already starts each session in the
#           workspace dir (-c), so the launcher drops `--workspace`.
#           Workspace registration: `was-agent mark <path>` (sqlite registry
#           at ~/.cache/tmux_warm_daemon/was_agent.db) is the preferred source
#           for the BASH daemon; the legacy /tmp json is still dual-written so
#           the Rust daemon keeps working unchanged.
#
# Idle-session reaper (tmux_session_reaper.sh). Detached tmux sessions with no
# activity for longer than idle_reaper_hours are killed; attached sessions and
# pool-managed ones (warm-N, agent-N, <pool>@<hash>) are always spared. The
# reaper is a separate, non-blocking process; idle_reaper_interval is how often
# (seconds) it wakes to scan. Set idle_reaper_hours to 0 to disable.
# These keys are ignored by the warm daemon (Rust/bash), so they are safe here.
idle_reaper_hours: 26
idle_reaper_interval: 3600
pools:
  warm:
    max_detached: 2
  agent:
    max_detached: 1
    command: $HOME/.local/bin/agent-warm.sh
