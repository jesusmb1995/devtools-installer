# =============================================================================
# tmux-wm.conf - OUTER "window manager" tmux (i3 replacement), terminal preset.
#
# This is the outer WM layer. It uses Alt-chord bindings (NO prefix) so it feels
# like i3: Alt+1..9 = windows (desktops), Alt+hjkl = focus pane, etc. It runs on
# a DEDICATED socket (-L wm, see ~/.local/bin/tmux-wm) so it never clashes with:
#   * the persistent warm-daemon tmux (default socket, ~/.tmux.conf), and
#   * an inner factory-default tmux (~/.local/bin/tmux-default, -L inner).
#
# Window-manager behavior (not a persistent server): `destroy-unattached on`
# kills the session on detach and `exit-empty on` tears the server down when no
# sessions remain - so detaching == closing the "desktop" (no reattach).
#
# All keys are Alt-only (plus Ctrl+Space for the launcher), leaving Ctrl+B free
# for a nested `tmux-default` session.
#
# IMPORTANT: tmux does NOT reliably parse `M-S-<key>` (Alt+Shift). For Shift
# combos we use UPPERCASE letters (M-H not M-S-h) and SHIFTED symbols (M-! not
# M-S-1). This follows the tmux-tilish plugin convention.
# =============================================================================
set -g default-shell "/bin/zsh"

# CRITICAL: unbind the default prefix (C-b) so it passes through to the warm
# daemon inside each pane. Without this, every Ctrl+B is captured by the
# outer WM instead of reaching the warm daemon session.
set -g prefix None
unbind-key C-b
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB,*:Tc"
set -g allow-passthrough on
set -g extended-keys on

# --- Window-manager behavior (transient, no reattach) ------------------------
set -g destroy-unattached on
set -g exit-empty on
set -g set-clipboard on

# Vi copy/selection + mouse.
set -g mode-keys vi
set -g mouse on

# Low escape-time lag (important for nvim inside a pane).
set -sg escape-time 10
set -g focus-events on

# Index windows/panes from 1 so Alt+1 maps to the first window.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Autorefresh layout after pane create/destroy (keeps tiling tidy, i3-like).
set-hook -g after-split-window "select-layout -E"
set-hook -g pane-exited "select-layout -E"

# --- Status bar (i3bar analog) -----------------------------------------------
set -g status on
set -g status-interval 2
set -g status-style "bg=default,fg=colour244"
set -g status-left  "#[fg=colour39,bold] tmux-wm "
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour39]%H:%M "
setw -g window-status-current-style "fg=black,bg=colour39,bold"
setw -g window-status-style         "fg=colour244,bg=default"
setw -g window-status-format        " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g status-left-length  20
set -g status-right-length 30

# =============================================================================
# Bindings - i3 layout. All prefix-free (Alt chords) via `bind-key -n`.
# =============================================================================

# --- Windows (i3 workspaces) -------------------------------------------------
# Alt+1..9 : focus window N (i3: mod+1..9). Creates the window if missing.

bind-key -n M-1 if-shell 'tmux list-windows | grep -q "^1:"' 'select-window -t :1' 'new-window -c "#{pane_current_path}" -n 1'

bind-key -n M-2 if-shell 'tmux list-windows | grep -q "^2:"' 'select-window -t :2' 'new-window -c "#{pane_current_path}" -n 2'

bind-key -n M-3 if-shell 'tmux list-windows | grep -q "^3:"' 'select-window -t :3' 'new-window -c "#{pane_current_path}" -n 3'

bind-key -n M-4 if-shell 'tmux list-windows | grep -q "^4:"' 'select-window -t :4' 'new-window -c "#{pane_current_path}" -n 4'

bind-key -n M-5 if-shell 'tmux list-windows | grep -q "^5:"' 'select-window -t :5' 'new-window -c "#{pane_current_path}" -n 5'

bind-key -n M-6 if-shell 'tmux list-windows | grep -q "^6:"' 'select-window -t :6' 'new-window -c "#{pane_current_path}" -n 6'

bind-key -n M-7 if-shell 'tmux list-windows | grep -q "^7:"' 'select-window -t :7' 'new-window -c "#{pane_current_path}" -n 7'

bind-key -n M-8 if-shell 'tmux list-windows | grep -q "^8:"' 'select-window -t :8' 'new-window -c "#{pane_current_path}" -n 8'

bind-key -n M-9 if-shell 'tmux list-windows | grep -q "^9:"' 'select-window -t :9' 'new-window -c "#{pane_current_path}" -n 9'


# Alt+Shift+1..9 : move focused pane to window N (i3: mod+Shift+1..9).
# Uses shifted symbols (!@#$%^&*) since M-S-1 is not reliably parsed by tmux.
# tmux-wm-move: join-pane if window exists, create+join+kill-dummy if missing.
# Gate: features.tmux_wm_move == 'false' → do NOT capture; explicitly unbind so
# Alt+Shift+number passes through to the app (nvim <A-!> tab maps). Plain
# Alt+1..9 (M-1..9 select-window above) is unaffected and keeps working.

# passthrough: Alt+Shift+number reaches nvim (tab switching)

unbind-key -n M-!

unbind-key -n M-@

unbind-key -n M-#

unbind-key -n M-$

unbind-key -n M-%

unbind-key -n M-^

unbind-key -n M-&

unbind-key -n M-*

unbind-key -n M-(



# Alt+Enter : open warm daemon tmux (Ctrl+B) — replaces shell pane or splits right
bind-key -n M-Enter run-shell "$HOME/.local/bin/tmux-wm-open $HOME/.local/bin/tmux-wm-terminal"
# Alt+Q : kill focused pane + refresh layout (i3: mod+Shift+q)
bind-key -n M-Q kill-pane \; select-layout -E
# Alt+f : toggle fullscreen (zoom) on focused pane (i3: mod+f)
bind-key -n M-f resize-pane -Z
# Alt+g : open nvim — replaces shell pane or splits right
bind-key -n M-g run-shell "$HOME/.local/bin/tmux-wm-open nvim"

# --- Panes (i3 splits + focus) -----------------------------------------------
# Alt+\ : split side-by-side (i3: mod+\ horizontal split)
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"
# Alt+v : split stacked (i3: mod+v vertical split)
bind-key -n M-v split-window -v -c "#{pane_current_path}"
# Alt+hjkl : focus pane (i3: mod+hjkl)
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
# Alt+Shift+hjkl : swap pane in that direction (i3: mod+Shift+hjkl)
# Uses -s (source) flag + uppercase letters (M-H not M-S-h).
bind-key -n M-H run-shell "$HOME/.local/bin/tmux-wm-swap left"
bind-key -n M-J run-shell "$HOME/.local/bin/tmux-wm-swap down"
bind-key -n M-K run-shell "$HOME/.local/bin/tmux-wm-swap up"
bind-key -n M-L run-shell "$HOME/.local/bin/tmux-wm-swap right"

# Alt+Space / Alt+e : cycle layout (i3: mod+space toggle / mod+e layout toggle)
bind-key -n M-Space next-layout
bind-key -n M-e next-layout

# --- Launcher (replaces rofi) ------------------------------------------------
# Ctrl+Space : fzf command launcher in a horizontal split.
bind-key -n C-Space run-shell "$HOME/.local/bin/tmux-wm-open $HOME/.local/bin/fzf-launcher"

# --- Resize mode (i3: mod+r) -------------------------------------------------
bind-key -n M-r switch-client -T resize
bind-key -rT resize h resize-pane -L 5
bind-key -rT resize j resize-pane -D 5
bind-key -rT resize k resize-pane -U 5
bind-key -rT resize l resize-pane -R 5
bind-key -rT resize Left  resize-pane -L 5
bind-key -rT resize Down  resize-pane -D 5
bind-key -rT resize Up    resize-pane -U 5
bind-key -rT resize Right resize-pane -R 5
bind-key -T resize r switch-client -T root
bind-key -T resize Escape switch-client -T root

# --- Misc / tmux access ------------------------------------------------------
# Alt+[ : copy mode (scrollback)
bind-key -n M-[ copy-mode
# Alt+/ : list bindings (help)
bind-key -n M-/ list-keys
# Alt+T : open a nested factory-default tmux (Ctrl+B prefix) in a vertical split
# Alt+N : open nnn file manager in a vertical split
bind-key -n M-N run-shell "$HOME/.local/bin/tmux-wm-open $HOME/.local/bin/nnn-wm"
# Alt+R : reload this config
bind-key -n M-R source-file ~/.config/tmux/tmux-wm.conf \; display-message "tmux-wm reloaded"
# Alt+Shift+e : detach (session destroyed via destroy-unattached)
bind-key -n M-E detach-client
